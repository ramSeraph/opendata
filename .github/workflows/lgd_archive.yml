name: LGD Monthly Compression

concurrency:
  group: lgd-raw-releases
  queue: max

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: astral-sh/setup-uv@v5
      - name: Discover datasets and reserve release destinations
        id: plan
        working-directory: lgd
        env:
          GH_TOKEN: ${{ github.token }}
          LGD_ARCHIVE_NUM_MONTHS_BACK: ${{ vars.LGD_ARCHIVE_NUM_MONTHS_BACK }}
        run: uv run python -m utils.archive_workflow prepare

  Archives:
    needs: Prepare
    if: needs.Prepare.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      # No max-parallel: archive jobs do not request data from LGD.
      matrix: ${{ fromJSON(needs.Prepare.outputs.matrix) }}
    uses: ./.github/workflows/lgd_archive_component.yml
    with:
      item: ${{ toJSON(matrix) }}

  Update-Listing:
    needs: [Prepare, Archives]
    if: ${{ always() && needs.Prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: astral-sh/setup-uv@v5
      - name: Redistribute remaining daily assets and refresh indexes
        working-directory: lgd
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m utils.archive_workflow settle

  BuildDocs:
    needs: Update-Listing
    if: ${{ always() && needs.Update-Listing.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit
