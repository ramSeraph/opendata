name: LGD Component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      collection-date:
        required: true
        type: string
      capacity-check:
        required: true
        type: string
      assignment:
        required: true
        type: string
      prerequisites:
        required: true
        type: string
    outputs:
      published:
        description: Exact release asset and checksum for dependent jobs
        value: ${{ jobs.Component.outputs.published }}

jobs:
  Admit:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      checks: write
    # Serialize reservation decisions, not the scrapers. This job never
    # contacts LGD and leaves the component's four-hour budget untouched.
    concurrency:
      group: lgd-component-admission
      queue: max
    outputs:
      slot: ${{ steps.reserve.outputs.slot }}
      attempt: ${{ steps.reserve.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reserve any available component slot
        id: reserve
        working-directory: lgd
        env:
          GH_TOKEN: ${{ github.token }}
          CAPACITY_CHECK: ${{ inputs.capacity-check }}
          LGD_COMPONENT: ${{ inputs.component }}
        run: python -m utils.component_capacity "$CAPACITY_CHECK" "$LGD_COMPONENT"

  Component:
    needs: Admit
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: write
    concurrency:
      group: lgd-component-slot-${{ needs.Admit.outputs.slot }}
      queue: max
    outputs:
      published: ${{ steps.run.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      LGD_COLLECTION_DATE: ${{ inputs.collection-date }}
      LGD_ASSIGNMENT: ${{ inputs.assignment }}
      LGD_NEEDS: ${{ inputs.prerequisites }}
      LGD_COMPONENT: ${{ inputs.component }}
    steps:
      - name: Verify reservation belongs to this attempt
        env:
          ADMISSION_ATTEMPT: ${{ needs.Admit.outputs.attempt }}
        run: |
          if [[ "$ADMISSION_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Capacity must be allocated again for a retry. Use Re-run all jobs; published datasets will be reused.'
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - name: Setup swap
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: lgd/uv.lock
      - name: Restore tesseract models
        uses: actions/cache/restore@v6.1.0
        id: models
        with:
          path: lgd/data/captcha/models/
          key: lgd-tesseract-models-gcs-v2
      - name: Download tesseract models
        if: steps.models.outputs.cache-hit != 'true'
        working-directory: lgd
        run: utils/download_captcha_models.sh data/captcha/models
      - name: Cache tesseract models
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: lgd/data/captcha/models/
          key: lgd-tesseract-models-gcs-v2
      - name: Install packages
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr p7zip-full
      - name: Restore this component's unfinished children
        uses: actions/cache/restore@v6.1.0
        with:
          path: lgd/data/raw/
          key: lgd-component-v1-${{ github.run_id }}-${{ inputs.component }}-${{ github.run_attempt }}
          restore-keys: lgd-component-v1-${{ github.run_id }}-${{ inputs.component }}-
      - name: Fetch prerequisites, scrape and publish component
        id: run
        timeout-minutes: 225
        working-directory: lgd
        run: uv run python -m utils.daily_workflow run "$LGD_COMPONENT"
      - name: Save unfinished component checkpoints
        if: ${{ always() && steps.run.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/cache/save@v6.1.0
        with:
          path: lgd/data/raw/
          key: lgd-component-v1-${{ github.run_id }}-${{ inputs.component }}-${{ github.run_attempt }}
