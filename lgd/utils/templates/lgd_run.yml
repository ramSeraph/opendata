# Generated by: cd lgd && uv run python -m utils.generate_daily_workflow
# Edit this template and the scraper's dependency declarations, then regenerate.
name: LGD Daily Run

# The archiver removes daily assets. Keep it outside the entire dependency run.
concurrency:
  group: lgd-raw-releases
  queue: max

on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: write
    outputs:
      date: ${{ steps.plan.outputs.date }}
      plan: ${{ steps.plan.outputs.plan }}
      capacity: ${{ steps.plan.outputs.capacity }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: lgd/uv.lock
      - name: Check generated dependency graph
        working-directory: lgd
        run: uv run python -m utils.generate_daily_workflow --check
      - name: Assign collection date, release destinations and shared capacity
        id: plan
        working-directory: lgd
        env:
          GH_TOKEN: ${{ github.token }}
          LGD_MAX_COMPONENT_JOBS: ${{ vars.LGD_MAX_COMPONENT_JOBS || '3' }}
        run: uv run python -m utils.daily_workflow prepare

@@COMPONENT_JOBS@@
  Update-Listing:
    needs: [@@ALL_JOBS@@]
    if: ${{ always() && needs.Prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          prune-cache: true
      - name: Refresh shared release listing after all uploads
        working-directory: lgd
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --with gh-release-tools==0.1.14 python utils/release_helper.py generate-lists -r lgd-latest -e .7z
      - name: Summarize component outcomes
        if: always()
        env:
          COMPONENT_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('| Component | Result |\n| --- | --- |\n')
              for name, job in json.loads(os.environ['COMPONENT_RESULTS']).items():
                  if name != 'Prepare':
                      output.write(f'| {name} | {job["result"]} |\n')
          PY

  BuildDocs:
    needs: Update-Listing
    if: ${{ always() && needs.Update-Listing.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit
