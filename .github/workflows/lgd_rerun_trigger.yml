name: LGD Monitor Daily Run
on:
  workflow_run:
    workflows:
      - LGD Daily Run
    types: [completed]

jobs:
  RetryTrigger:
    uses: ./.github/workflows/common-rerun-trigger.yml
    secrets: inherit
    with:
      alert-title: "LGD Daily Run failed"
      num-attempts: 3
      retry-timeouts: true
      # Recreate admissions for the new attempt. Components with a published
      # dated asset reuse it instead of repeating their scrape.
      failed-jobs-only: false
