# Generated by: cd lgd && uv run python -m utils.generate_daily_workflow
# Edit this template and the scraper's dependency declarations, then regenerate.
name: LGD Daily Run

# The archiver removes daily assets. Keep it outside the entire dependency run.
concurrency:
  group: lgd-raw-releases
  queue: max

on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      date: ${{ steps.plan.outputs.date }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: lgd/uv.lock
      - name: Check generated dependency graph
        working-directory: lgd
        run: uv run python -m utils.generate_daily_workflow --check
      - name: Assign collection date, release destinations and worker slots
        id: plan
        working-directory: lgd
        env:
          GH_TOKEN: ${{ github.token }}
          LGD_MAX_COMPONENT_JOBS: ${{ vars.LGD_MAX_COMPONENT_JOBS || '3' }}
        run: uv run python -m utils.daily_workflow prepare

  STATES:
    needs: [Prepare]
    permissions:
      contents: write
    uses: ./.github/workflows/lgd_component.yml
    with:
      component: STATES
      collection-date: ${{ needs.Prepare.outputs.date }}
      slot: ${{ fromJSON(needs.Prepare.outputs.plan).STATES.slot }}
      assignment: ${{ toJSON(fromJSON(needs.Prepare.outputs.plan).STATES) }}
      prerequisites: ${{ toJSON(needs) }}

  DISTRICTS:
